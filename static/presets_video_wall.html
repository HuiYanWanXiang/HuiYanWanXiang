<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>绘演万象 · 3x3 视频墙</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
      }

      .wall {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 2px;
        padding: 2px;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="wall">
      <video src="/static/presets/apollonius_circle/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/conic_sections/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/convex_lens_imaging/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/derivative_geometric_meaning/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/pythagorean_theorem/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/electric_field_lines/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/forced_oscillation/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/vectors/video.mp4" autoplay muted loop playsinline></video>
      <video src="/static/presets/lorentz_force/video.mp4" autoplay muted loop playsinline></video>
    </div>
  </body>
</html>
