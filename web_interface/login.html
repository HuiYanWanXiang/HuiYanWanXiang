<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 绘演万象</title>
  <style>
    :root { --primary: #0f172a; --primary-foreground: #ffffff; --background: #ffffff; --foreground: #020817; --muted: #f1f5f9; --muted-foreground: #64748b; --border: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--background); color: var(--foreground); min-height: 100vh; display: grid; }
    @media (min-width: 1024px) { body { grid-template-columns: 1fr 1fr; } }

    .left-panel { display: none; background: linear-gradient(to bottom right, #1e293b, #0f172a, #020817); padding: 3rem; color: var(--primary-foreground); position: relative; overflow: hidden; flex-direction: column; justify-content: space-between; }
    @media (min-width: 1024px) { .left-panel { display: flex; } }
    .deco-bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 20px 20px; opacity: 0.2; pointer-events: none; }

    .characters-container { position: relative; width: 100%; max-width: 550px; height: 400px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: center; }
    .character { position: absolute; bottom: 0; transform-origin: bottom center; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .char-purple { left: 10%; width: 180px; height: 400px; background-color: #6C3FF5; border-radius: 10px 10px 0 0; z-index: 1; }
    .char-black { left: 40%; width: 120px; height: 310px; background-color: #2D2D2D; border-radius: 8px 8px 0 0; z-index: 2; }
    .char-orange { left: -5%; width: 240px; height: 200px; background-color: #FF9B6B; border-radius: 120px 120px 0 0; z-index: 3; }
    .char-yellow { left: 55%; width: 140px; height: 230px; background-color: #E8D754; border-radius: 70px 70px 0 0; z-index: 4; }

    .eyes-container { position: absolute; display: flex; transition: all 0.4s ease-out; }
    .char-purple .eyes-container { gap: 32px; left: 45px; top: 40px; }
    .char-black .eyes-container { gap: 24px; left: 26px; top: 32px; }
    .char-orange .eyes-container { gap: 32px; left: 82px; top: 90px; }
    .char-yellow .eyes-container { gap: 20px; left: 60px; top: 55px; }

    .eye-white { background-color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: height 0.15s ease-in-out; }
    .char-purple .eye-white { width: 18px; height: 18px; }
    .char-black .eye-white { width: 16px; height: 16px; }
    .pupil { background-color: #2D2D2D; border-radius: 50%; position: relative; transition: transform 0.1s ease-out; }
    .char-purple .pupil { width: 7px; height: 7px; }
    .char-black .pupil { width: 6px; height: 6px; }
    .char-orange .pupil, .char-yellow .pupil { width: 12px; height: 12px; }
    .yellow-mouth { position: absolute; width: 20px; height: 4px; background-color: #2D2D2D; border-radius: 2px; left: 73px; top: 95px; transition: all 0.4s ease-out; }

    .right-panel { display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .form-container { width: 100%; max-width: 400px; }
    .header-text { text-align: center; margin-bottom: 2.5rem; }
    .header-text h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.025em; }
    .header-text p { color: var(--muted-foreground); font-size: 0.875rem; }
    .form-group { margin-bottom: 1.25rem; position: relative; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
    .form-group input { width: 100%; height: 3rem; padding: 0 1rem; border-radius: 0.375rem; border: 1px solid var(--border); outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-size: 1rem; background-color: transparent; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .btn-toggle-pwd { position: absolute; right: 1rem; top: 2.25rem; background: none; border: none; color: var(--muted-foreground); cursor: pointer; font-size: 0.875rem; padding: 0.2rem; }
    .btn-toggle-pwd:hover { color: var(--foreground); }
    .btn-submit { width: 100%; height: 3rem; background-color: var(--primary); color: var(--primary-foreground); border: none; border-radius: 0.375rem; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 1rem; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.9; }
    .btn-google { width: 100%; height: 3rem; background-color: var(--background); color: var(--foreground); border: 1px solid var(--border); border-radius: 0.375rem; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 1rem; transition: background-color 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-google:hover { background-color: var(--muted); }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="deco-bg"></div>
    <div style="font-weight: bold; font-size: 1.2rem; z-index: 10;">✨ 绘演万象</div>
    <div class="characters-container" id="stage">
      <div class="character char-purple" id="char-purple">
        <div class="eyes-container" id="eyes-purple">
          <div class="eye-white"><div class="pupil" data-max="5"></div></div>
          <div class="eye-white"><div class="pupil" data-max="5"></div></div>
        </div>
      </div>
      <div class="character char-black" id="char-black">
        <div class="eyes-container" id="eyes-black">
          <div class="eye-white"><div class="pupil" data-max="4"></div></div>
          <div class="eye-white"><div class="pupil" data-max="4"></div></div>
        </div>
      </div>
      <div class="character char-orange" id="char-orange">
        <div class="eyes-container" id="eyes-orange">
          <div class="pupil" data-max="5"></div>
          <div class="pupil" data-max="5"></div>
        </div>
      </div>
      <div class="character char-yellow" id="char-yellow">
        <div class="eyes-container" id="eyes-yellow">
          <div class="pupil" data-max="5"></div>
          <div class="pupil" data-max="5"></div>
        </div>
        <div class="yellow-mouth" id="mouth-yellow"></div>
      </div>
    </div>
    <div style="color: rgba(255,255,255,0.6); font-size: 0.875rem; z-index: 10; display: flex; gap: 20px;">
      <a href="#" style="color: inherit; text-decoration: none;">隐私政策</a>
      <a href="#" style="color: inherit; text-decoration: none;">服务条款</a>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-container">
      <div class="header-text">
        <h1>欢迎回来！</h1>
        <p>请输入您的账号信息以继续</p>
      </div>

      <!-- ✅ 只做跳转，不做真实鉴权 -->
      <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='/app';">
        <div class="form-group">
          <label for="email">邮箱</label>
          <input type="email" id="email" placeholder="name@example.com" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="••••••••" required>
          <button type="button" class="btn-toggle-pwd" id="togglePwd">显示</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="remember"> 记住我 30 天
          </label>
          <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 500;">忘记密码？</a>
        </div>
        <button type="submit" class="btn-submit">登 录</button>
      </form>

      <div style="text-align: center; font-size: 0.875rem; color: var(--muted-foreground); margin-top: 2rem;">
        还没有账号？ <a href="#" style="color: var(--foreground); font-weight: 500; text-decoration: none;">立即注册</a>
      </div>
    </div>
  </div>

  <script>
    const emailInput = document.getElementById('email');
    const pwdInput = document.getElementById('password');
    const togglePwdBtn = document.getElementById('togglePwd');
    const chars = { purple: document.getElementById('char-purple'), black: document.getElementById('char-black'), orange: document.getElementById('char-orange'), yellow: document.getElementById('char-yellow') };
    const eyes = { purple: document.getElementById('eyes-purple'), black: document.getElementById('eyes-black'), orange: document.getElementById('eyes-orange'), yellow: document.getElementById('eyes-yellow') };
    const mouthYellow = document.getElementById('mouth-yellow');
    const allPupils = document.querySelectorAll('.pupil');

    let mouseX = window.innerWidth / 2; let mouseY = window.innerHeight / 2;
    let isTyping = false; let showPassword = false; let passwordLength = 0;

    togglePwdBtn.addEventListener('click', () => {
      showPassword = !showPassword;
      pwdInput.type = showPassword ? "text" : "password";
      togglePwdBtn.innerText = showPassword ? "隐藏" : "显示";
      updateCharactersState();
    });

    emailInput.addEventListener('focus', () => { isTyping = true; updateCharactersState(); });
    emailInput.addEventListener('blur', () => { isTyping = false; updateCharactersState(); });
    pwdInput.addEventListener('focus', () => { isTyping = true; updateCharactersState(); });
    pwdInput.addEventListener('blur', () => { isTyping = false; updateCharactersState(); });
    pwdInput.addEventListener('input', (e) => { passwordLength = e.target.value.length; updateCharactersState(); });

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      updateEyePositions(); updateBodySkew();
    });

    function updateCharactersState() {
      if (passwordLength > 0 && showPassword) {
        chars.purple.style.transform = `skewX(0deg)`; chars.black.style.transform = `skewX(0deg)`;
        chars.orange.style.transform = `skewX(0deg)`; chars.yellow.style.transform = `skewX(0deg)`;
        eyes.purple.style.left = '20px'; eyes.purple.style.top = '35px';
        eyes.black.style.left = '10px'; eyes.black.style.top = '28px';
        eyes.orange.style.left = '50px'; eyes.orange.style.top = '85px';
        eyes.yellow.style.left = '25px'; eyes.yellow.style.top = '45px';
        mouthYellow.style.left = '15px'; mouthYellow.style.top = '90px';
      } else if (isTyping || (passwordLength > 0 && !showPassword)) {
        const centerX = window.innerWidth / 4; const deltaX = mouseX - centerX;
        const skew = Math.max(-6, Math.min(6, -deltaX / 120));
        chars.purple.style.transform = `skewX(${skew - 12}deg) translateX(40px)`;
        chars.black.style.transform = `skewX(${skew * 1.5}deg)`;
        eyes.purple.style.left = '45px'; eyes.purple.style.top = '40px';
        eyes.black.style.left = '26px'; eyes.black.style.top = '32px';
        eyes.orange.style.left = '82px'; eyes.orange.style.top = '90px';
        eyes.yellow.style.left = '60px'; eyes.yellow.style.top = '55px';
        mouthYellow.style.left = '45px'; mouthYellow.style.top = '95px';
      }
    }

    function updateBodySkew() {
      if (passwordLength > 0 && showPassword) return;
      const centerX = window.innerWidth / 4; const deltaX = mouseX - centerX;
      const skew = Math.max(-6, Math.min(6, -deltaX / 120));
      if (!isTyping) {
        chars.purple.style.transform = `skewX(${skew}deg)`; chars.black.style.transform = `skewX(${skew}deg)`;
        chars.orange.style.transform = `skewX(${skew}deg)`; chars.yellow.style.transform = `skewX(${skew}deg)`;
      } else { updateCharactersState(); }
    }

    function updateEyePositions() {
      allPupils.forEach(pupil => {
        const rect = pupil.parentElement.getBoundingClientRect();
        const eyeCenterX = rect.left + rect.width / 2; const eyeCenterY = rect.top + rect.height / 2;
        const deltaX = mouseX - eyeCenterX; const deltaY = mouseY - eyeCenterY;
        const maxDist = parseInt(pupil.getAttribute('data-max')) || 5;
        const distance = Math.min(Math.sqrt(deltaX ** 2 + deltaY ** 2), maxDist);
        const angle = Math.atan2(deltaY, deltaX);
        let x = Math.cos(angle) * distance; let y = Math.sin(angle) * distance;
        if (passwordLength > 0 && showPassword) { x = -4; y = -4; }
        pupil.style.transform = `translate(${x}px, ${y}px)`;
      });
    }

    function blinkRandomly(element) {
      setInterval(() => {
        element.style.height = '2px';
        setTimeout(() => { element.style.height = ''; }, 150);
      }, Math.random() * 4000 + 3000);
    }
    document.querySelectorAll('.char-purple .eye-white, .char-black .eye-white').forEach(blinkRandomly);
  </script>
</body>
</html>
